services:
  # --------------------------------------------------------------------------
  # LexiRAG FastAPI Backend Service (Free Tier Web Service)
  # --------------------------------------------------------------------------
  - type: web
    name: lexirag-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python main.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: RELOAD
        value: "false"
      - key: DEFAULT_MODEL
        value: "gemini-1.5-flash"
      - key: GEMINI_API_KEY
        sync: false # Free from https://aistudio.google.com
      - key: OPENAI_API_KEY
        sync: false # Optional fallback

  # --------------------------------------------------------------------------
  # LexiRAG React Frontend (Free Tier Static Site)
  # --------------------------------------------------------------------------
  - type: static
    name: lexirag-frontend
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: lexirag-backend
          property: host
